name: live feed
# Every hour: read what landed on the market program since the last run and publish it as
# docs/live.json, which the report page renders. Through Solami's RPC when the SOLAMI_API_KEY
# secret is set, the public node otherwise; market cards only when PANTA_API_KEY is set.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: live-feed
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: read the chain
        env:
          SOLAMI_API_KEY: ${{ secrets.SOLAMI_API_KEY }}
          PANTA_API_KEY: ${{ secrets.PANTA_API_KEY }}
        run: |
          if [ -n "$SOLAMI_API_KEY" ]; then export SOLANA_RPC="https://rpc.solami.dev/solana?api-key=$SOLAMI_API_KEY"; fi
          python demo/live.py
      - name: publish
        run: |
          git config user.name "settlement-check live feed"
          git config user.email "actions@users.noreply.github.com"
          git add docs/live.json
          git diff --cached --quiet && exit 0
          git commit -qm "live feed: $(date -u +'%Y-%m-%d %H:%M') UTC"
          git pull -q --rebase && git push -q
